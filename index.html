<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyJobMyanmar</title>
  <meta name="description" content="EasyJobMyanmar - အလုပ်ရှာဖွေသူနှင့် အလုပ်ရှင်များအတွက် လွယ်ကူသော ဆက်သွယ်ရေး Platform">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* ===== 1. RESET & VARIABLES ===== */
    :root {
      --bg-color: #0d1117;
      --bg-secondary: #151c26;
      --card-bg: #1b2431;
      --text-primary: #eef1f5;
      --text-secondary: #8b96a5;
      --gold: #c9a13b;
      --gold-light: #e0c05c;
      --gold-gradient: linear-gradient(135deg, #c9a13b, #e0c05c);
      --navy: #17233a;
      --border-color: rgba(201, 161, 59, 0.15);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      --radius: 14px;
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    ul {
      list-style: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-color);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
    }

    /* ===== 2. LANDING / ENTER PAGE ===== */
    .landing {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      text-align: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 20%, rgba(201, 161, 59, 0.08), transparent 60%),
        var(--bg-color);
      overflow: hidden;
    }

    .landing::before,
    .landing::after {
      content: '';
      position: absolute;
      border: 1px solid var(--border-color);
      border-radius: 50%;
    }

    .landing::before {
      width: 500px;
      height: 500px;
      top: -180px;
      left: -180px;
    }

    .landing::after {
      width: 350px;
      height: 350px;
      bottom: -150px;
      right: -150px;
    }

    .landing-icon {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--gold-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--bg-color);
      margin-bottom: 28px;
      box-shadow: 0 0 40px rgba(201, 161, 59, 0.35);
      position: relative;
      z-index: 2;
    }

    .landing-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      font-weight: 800;
      letter-spacing: 1px;
      position: relative;
      z-index: 2;
    }

    .landing-title span {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .landing-tagline {
      color: var(--text-secondary);
      font-size: 1.05rem;
      max-width: 480px;
      margin: 18px 0 44px;
      position: relative;
      z-index: 2;
    }

    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 46px;
      border-radius: 50px;
      background: var(--gold-gradient);
      color: var(--bg-color);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      border: none;
      transition: var(--transition);
      position: relative;
      z-index: 2;
    }

    .enter-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(201, 161, 59, 0.4);
    }

    .enter-btn i {
      transition: var(--transition);
    }

    .enter-btn:hover i {
      transform: translateX(4px);
    }

    @media (max-width: 500px) {
      .landing-icon {
        width: 72px;
        height: 72px;
        font-size: 1.6rem;
      }
      .enter-btn {
        padding: 14px 36px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <!-- ===== LANDING / ENTER PAGE ===== -->
  <section class="landing" id="landing">
    <div class="landing-icon">
      <i class="fa-solid fa-briefcase"></i>
    </div>
    <h1 class="landing-title">Easy<span>Job</span>Myanmar</h1>
    <p class="landing-tagline">
      အလုပ်ရှင်နှင့် အလုပ်ရှာဖွေသူများ လွယ်ကူချောမွေ့စွာ ဆက်သွယ်နိုင်သော Platform
    </p>
    <button class="enter-btn" id="enterBtn">
      Enter <i class="fa-solid fa-arrow-right"></i>
    </button>
  </section>

  <!-- နောက်ပိုင်း Part 2 မှာ Main Site (Job Category + Search) ကို ထည့်ပါမယ် -->

</body>
</html>
